name: Build & Deploy — ms-mensajes

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build TypeScript y deploy a Azure App Service

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      - name: Empaquetar para deploy
        run: zip -r deploy.zip dist package.json package-lock.json

      - name: Deploy a Azure App Service via Kudu ZIP API
        env:
          KUDU_CREDENTIALS: ${{ secrets.KUDU_CREDENTIALS_MS_MENSAJES }}
        run: |
          curl -X POST \
            "https://ms-mensajes.scm.azurewebsites.net/api/zipdeploy?isAsync=false" \
            -u "$KUDU_CREDENTIALS" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            --fail \
            --show-error \
            --silent \
            -w "\nHTTP status: %{http_code}\n"
