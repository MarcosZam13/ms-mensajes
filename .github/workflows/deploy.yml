name: Build & Deploy — ms-mensajes

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite disparar manualmente desde GitHub Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build TypeScript y deploy a Azure App Service

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      # Empaquetar solo lo necesario para producción:
      # dist/ (JS compilado) + package.json + package-lock.json
      # Azure instala las node_modules en el servidor con npm install --production
      - name: Empaquetar para deploy
        run: zip -r deploy.zip dist package.json package-lock.json

      - name: Deploy a Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ms-mensajes
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_MS_MENSAJES }}
          package: deploy.zip
